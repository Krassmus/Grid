[package]
name = "grid-server"
version = "0.1.0"
edition = "2024"
description = "Sync-Server für Grid-Dokumente"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
yrs = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
ed25519-dalek = "2"
hmac = "0.12"
getrandom = "0.3"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tokio-tungstenite = "0.27"
