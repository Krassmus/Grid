[package]
name = "tauri-plugin-iap"
version = "0.1.0"
authors = [ "Grid" ]
description = "In-App-Kauf über StoreKit 2 (iPad, iPhone) für Grid"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-iap"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
